name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.h' '*.cc')
          [ -z "$files" ] || clang-format --dry-run --Werror $files

  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ASan + UBSan (gcc)", preset: asan,    cxx: g++ }
          - { name: "TSan (gcc)",         preset: tsan,    cxx: g++ }
          - { name: "Release (gcc)",      preset: release, cxx: g++ }
          - { name: "Release (clang)",    preset: release, cxx: clang++ }
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Ubuntu 24.04 runners use high ASLR entropy, which makes TSan abort
      # with "unexpected memory mapping". Lower it for this job.
      - name: Lower ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Benchmark smoke test
        if: matrix.preset == 'release'
        run: |
          cmake --preset bench
          cmake --build --preset bench --target strata_bench
          # Any failed operation makes this exit non-zero and fails the job.
          ./build/bench/strata_bench --num=10000 --sync_num=200 --ycsb_ops=100000 --threads=2 --benchmarks=all
          # Each YCSB row has to have run the read/update mix it claims.
          awk -f bench/check_ycsb_mix.awk bench/results/benchmarks.csv
          # A bad workload name has to be rejected, not skipped.
          if ./build/bench/strata_bench --benchmarks=nosuch; then
            echo "strata_bench accepted an unknown workload"
            exit 1
          fi
          # So does a skew that fails every range comparison.
          if ./build/bench/strata_bench --zipf_theta=nan --benchmarks=ycsbc; then
            echo "strata_bench accepted a NaN theta"
            exit 1
          fi
          # So does a LevelDB read mode that doesn't exist.
          if ./build/bench/strata_bench --leveldb_mmap=2 --benchmarks=readrandom; then
            echo "strata_bench accepted a bad --leveldb_mmap"
            exit 1
          fi

      - name: Benchmark feature test
        if: matrix.preset == 'release'
        run: bash bench/strata_bench_test.sh

      - name: Experiments test
        if: matrix.preset == 'release'
        run: bash bench/run_experiments_test.sh

      - name: Benchmark runner test
        if: matrix.preset == 'release'
        run: |
          # A killed run has to fail the script, not vanish from the medians.
          bash bench/run_benchmarks_test.sh
          # Both tiers end to end, including the memory limit and every check on the results.
          ./bench/run_benchmarks.sh --skip-build --skip-fio --num=10K --sync-num=20 --ycsb-ops=100K \
              --runs=2 --memory-limit=64M --db-dir="$RUNNER_TEMP/bench_db" --output-dir="$RUNNER_TEMP/bench_out"
